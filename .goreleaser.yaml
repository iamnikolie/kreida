version: 2

project_name: kreida

before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
    - touch web/dist/.keep

builds:
  - id: kreida
    binary: kreida
    main: .
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, freebsd]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/iamnikolie/kreida/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - demo/*.yaml

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  github:
    owner: iamnikolie
    name: kreida
